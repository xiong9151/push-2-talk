name: Release Pipeline

on:
  push:
    branches:
      - main        # 监听 main 分支的普通提交（只测试构建）
    tags:
      - 'v*'        # 监听打标签（执行发布）
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  # ========================================================
  # Job 1: 构建测试 (Build Test)
  # 场景: 只是 Push 代码到 main 分支，没有打 Tag
  # 目的: 确保代码能编译通过，但不消耗版本号，不发布
  # ========================================================
  test-build:
    # 如果不是 Tag，且不是手动触发，则运行测试
    if: startsWith(github.ref, 'refs/tags/') != true
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install CMake (required for opus crate)
        run: |
          # Check if CMake is already available on the runner
          if (Get-Command cmake -ErrorAction SilentlyContinue) {
            Write-Host "CMake already installed: $(cmake --version)"
          } else {
            Write-Host "CMake not found, downloading portable version..."
            # Download CMake portable zip from GitHub releases (more reliable than choco)
            $url = "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip"
            $zipPath = "$env:TEMP\cmake.zip"
            $extractPath = "$env:ProgramFiles\CMake"
            try {
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing
              Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
              $cmakeBin = "$extractPath\cmake-3.31.6-windows-x86_64\bin"
              # Add to GITHUB_PATH for subsequent steps
              Add-Content -Path $env:GITHUB_PATH -Value $cmakeBin
              Write-Host "CMake installed successfully"
            } catch {
              Write-Host "CMake download failed: $_"
              Write-Host "Continuing without CMake (opus crate will fail to compile)"
            }
          }

      - name: Cargo check (fast, surfaces Rust/FFI errors early)
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo check --manifest-path src-tauri/Cargo.toml --bin push-to-talk

      - name: Build only (No Release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: 
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: npm run tauri build

  # ========================================================
  # Job 2: 正式发布 (Release)
  # 场景: 推送了 v* 标签
  # 目的: 生成更新日志、签名、打包、上传 Release
  # ========================================================
  release:
    # 只有当推送的是 Tag 时才运行
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          CHANGELOG=$(printf '%s\n' \
            '## ✨ 新功能' \
            '- RNNoise 神经网络降噪（可调强度 0-100%）' \
            '- 环回监听：独立麦克风实时监听模式，打开开关即可试听降噪效果' \
            '- 录音调试：选择窗口中播放降噪后音频按钮' \
            '- 渐进式结果面板：每个预设结果识别好就立即显示' \
            '- 多结果选择窗口 + 并行 LLM 润色' \
            '- 自定义 ASR 提供商支持' \
            '- 实时转录悬浮窗' \
            '' \
            '## 🐛 Bug 修复' \
            '- 快速连续按键修复（以最后一次为准）' \
            '- 多选设置重启后不丢失' \
            '- 配置 API Key 保存不丢失' \
            '- 悬浮窗二次弹出修复' \
            '- 降噪/环回监听开关实时生效' \
            '- 编译错误修复（EXPORT 宏、头文件缺失、MutexGuard Send 等）' \
            '' \
            '## 🔧 优化' \
            '- SpeexDSP AEC 回声消除（vendored C + cc, OBS 方式，无 pkg-config）' \
            '- 自动生成 release notes 聚合' \
            '- 环回监听音量提升至 0.4，降噪强度提升至 80%' \
            '- 降噪处理顺序改为 RNNoise 优先 → AGC 补音量'
          )
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Delete existing release for this tag (if any)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TAG = "$env:GITHUB_REF" -replace '^refs/tags/', ''
          Write-Host "Checking for existing release with tag: $TAG"
          try {
            $response = curl.exe -s -H "Authorization: token $env:GITHUB_TOKEN" `
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG"
            $release = $response | ConvertFrom-Json
            if ($release.id) {
              Write-Host "Found existing release ID: $($release.id), deleting..."
              curl.exe -s -X DELETE -H "Authorization: token $env:GITHUB_TOKEN" `
                "https://api.github.com/repos/${{ github.repository }}/releases/$($release.id)"
              Write-Host "Deleted old release."
            } else {
              Write-Host "No existing release found for this tag."
            }
          } catch {
            Write-Host "No existing release found (or error: $($_.Exception.Message))."
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Install CMake (required for opus crate)
        run: |
          # Check if CMake is already available on the runner
          if (Get-Command cmake -ErrorAction SilentlyContinue) {
            Write-Host "CMake already installed: $(cmake --version)"
          } else {
            Write-Host "CMake not found, downloading portable version..."
            # Download CMake portable zip from GitHub releases (more reliable than choco)
            $url = "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip"
            $zipPath = "$env:TEMP\cmake.zip"
            $extractPath = "$env:ProgramFiles\CMake"
            try {
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing
              Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
              $cmakeBin = "$extractPath\cmake-3.31.6-windows-x86_64\bin"
              # Add to GITHUB_PATH for subsequent steps
              Add-Content -Path $env:GITHUB_PATH -Value $cmakeBin
              Write-Host "CMake installed successfully"
            } catch {
              Write-Host "CMake download failed: $_"
              Write-Host "Continuing without CMake (opus crate will fail to compile)"
            }
          }

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: 
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: |
            ${{ steps.changelog.outputs.changelog }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
